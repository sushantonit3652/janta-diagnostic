<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0d1b33"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with Border -->
  <rect width="500" height="500" rx="250" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="240" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="250" cy="250" r="236" fill="url(#glowGrad)"/>

  <!-- React Native Atomic Orbits in background -->
  <g transform="translate(250, 250)" stroke="url(#orbitGrad)" stroke-width="2.5" fill="none" opacity="0.45">
    <ellipse rx="170" ry="60" transform="rotate(0)"/>
    <ellipse rx="170" ry="60" transform="rotate(60)"/>
    <ellipse rx="170" ry="60" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="14" fill="#38bdf8" filter="url(#softGlow)"/>
  </g>

  <!-- Developer Silhouette / Avatar Representation -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Torso -->
    <path d="M 140 430 C 140 340, 200 320, 250 320 C 300 320, 360 340, 360 430 Z" fill="#1e293b"/>
    <path d="M 145 430 C 150 350, 205 330, 250 330 C 295 330, 350 350, 355 430 Z" fill="#0f172a"/>
    <path d="M 210 330 L 250 380 L 290 330 Z" fill="#334155" opacity="0.6"/>

    <!-- Neck -->
    <rect x="228" y="270" width="44" height="60" rx="10" fill="#cbd5e1" opacity="0.9"/>

    <!-- Head -->
    <ellipse cx="250" cy="220" rx="60" ry="72" fill="#e2e8f0"/>
    
    <!-- Hair Modern Cut -->
    <path d="M 188 200 C 185 140, 230 130, 260 130 C 300 130, 315 150, 312 190 C 295 170, 250 170, 220 180 C 200 185, 192 195, 188 200 Z" fill="#1e293b"/>
    
    <!-- Modern Glasses (Tech Signature) -->
    <rect x="202" y="205" width="40" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="258" y="205" width="40" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <line x1="242" y1="218" x2="258" y2="218" stroke="#38bdf8" stroke-width="3"/>

    <!-- Subtle Smile -->
    <path d="M 235 258 Q 250 268 265 258" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- React Native Badge Floating at Bottom -->
  <g transform="translate(145, 410)">
    <rect width="210" height="52" rx="26" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
    <!-- React icon small -->
    <g transform="translate(32, 26) scale(0.65)" stroke="#38bdf8" stroke-width="3" fill="none">
      <ellipse rx="22" ry="8" transform="rotate(0)"/>
      <ellipse rx="22" ry="8" transform="rotate(60)"/>
      <ellipse rx="22" ry="8" transform="rotate(120)"/>
      <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    </g>
    <text x="64" y="32" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">REACT NATIVE</text>
  </g>
</svg>
