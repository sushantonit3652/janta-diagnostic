<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111c38"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="visaG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="400" fill="url(#bgG)"/>
  
  <!-- Subtle decorative travel grid / route line -->
  <path d="M 40 180 Q 200 60 400 130 T 560 90" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="200" cy="98" r="4" fill="#38bdf8"/>
  <circle cx="400" cy="130" r="4" fill="#38bdf8"/>
  <text x="30" y="42" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">AIROPASS MOBILE APP</text>
  <text x="30" y="60" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8">Travel • Visas • Insurance • Partner Mode</text>

  <!-- Concept visual badge -->
  <g transform="translate(420, 26)">
    <rect width="150" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="75" y="16" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8" text-anchor="middle">CONCEPT VISUAL</text>
  </g>

  <!-- Central Mobile Device Mockup Frame -->
  <g transform="translate(190, 65)" filter="url(#shadow)">
    <!-- Device Body -->
    <rect width="220" height="320" rx="30" fill="#020617" stroke="#334155" stroke-width="3"/>
    
    <!-- Screen Area -->
    <rect x="8" y="8" width="204" height="304" rx="22" fill="#090d16"/>

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="80" y="14" width="60" height="12" rx="6" fill="#000000"/>

    <!-- App Header -->
    <text x="22" y="45" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Airopass</text>
    <rect x="140" y="34" width="60" height="18" rx="9" fill="url(#visaG)"/>
    <text x="170" y="46" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">PARTNER</text>

    <!-- Wallet / Quick Balance Card -->
    <rect x="20" y="60" width="180" height="52" rx="10" fill="url(#cardG)" stroke="#1e293b"/>
    <text x="32" y="78" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Wallet Balance</text>
    <text x="32" y="98" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#38bdf8">$4,250.00</text>
    <rect x="145" y="73" width="45" height="24" rx="6" fill="#0284c7"/>
    <text x="167" y="89" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">+ Add</text>

    <!-- Trip Type Selector Tabs -->
    <g transform="translate(20, 122)">
      <rect width="180" height="28" rx="8" fill="#131d31"/>
      <rect x="2" y="2" width="56" height="24" rx="6" fill="#0284c7"/>
      <text x="30" y="17" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">One Way</text>
      <text x="90" y="17" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Round Trip</text>
      <text x="150" y="17" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Multi-City</text>
    </g>

    <!-- Booking / Services Card -->
    <rect x="20" y="160" width="180" height="70" rx="10" fill="url(#cardG)" stroke="#1e293b"/>
    <circle cx="38" cy="182" r="10" fill="#0369a1"/>
    <text x="38" y="186" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">✈</text>
    <text x="56" y="182" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#ffffff">DEL → DXB</text>
    <text x="56" y="194" font-family="'Poppins', sans-serif" font-size="8" fill="#64748b">Direct Flight • Nov 15</text>
    <line x1="30" y1="204" x2="190" y2="204" stroke="#1e293b" stroke-width="1"/>
    <text x="30" y="220" font-family="'Poppins', sans-serif" font-size="8" fill="#38bdf8">✓ Tourist Visa Fast-Track Included</text>

    <!-- Bottom Navigation Bar -->
    <rect x="8" y="272" width="204" height="40" rx="0" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <circle cx="40" cy="290" r="5" fill="#38bdf8"/>
    <circle cx="80" cy="290" r="5" fill="#475569"/>
    <circle cx="128" cy="290" r="5" fill="#475569"/>
    <circle cx="174" cy="290" r="5" fill="#475569"/>
  </g>

  <!-- Feature callout tags on sides -->
  <g transform="translate(30, 240)">
    <rect width="130" height="32" rx="6" fill="#131d31" stroke="#1e293b"/>
    <text x="12" y="20" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8">🛂 Visa Services</text>
  </g>
  <g transform="translate(30, 285)">
    <rect width="130" height="32" rx="6" fill="#131d31" stroke="#1e293b"/>
    <text x="12" y="20" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8">🛡 Travel Insurance</text>
  </g>
  <g transform="translate(435, 240)">
    <rect width="135" height="32" rx="6" fill="#131d31" stroke="#1e293b"/>
    <text x="12" y="20" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#818cf8">💼 Partner Mode</text>
  </g>
  <g transform="translate(435, 285)">
    <rect width="135" height="32" rx="6" fill="#131d31" stroke="#1e293b"/>
    <text x="12" y="20" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#818cf8">💳 Wallet Payments</text>
  </g>
</svg>
