<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121e"/>
      <stop offset="50%" stop-color="#0b1b2d"/>
      <stop offset="100%" stop-color="#071322"/>
    </linearGradient>
    <linearGradient id="vaultCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14263e"/>
      <stop offset="100%" stop-color="#0c1828"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="secShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#secBg)"/>

  <!-- Subtle Encrypted Grid / Circuit Lines in Background -->
  <g opacity="0.12" stroke="#06b6d4" stroke-width="1.5" fill="none">
    <path d="M 30 100 H 180 L 220 140 H 380 L 420 100 H 570"/>
    <path d="M 30 300 H 150 L 200 250 H 400 L 450 300 H 570"/>
    <circle cx="220" cy="140" r="4" fill="#06b6d4"/>
    <circle cx="380" cy="140" r="4" fill="#06b6d4"/>
    <circle cx="200" cy="250" r="4" fill="#06b6d4"/>
    <circle cx="400" cy="250" r="4" fill="#06b6d4"/>
  </g>

  <!-- Title Header -->
  <text x="30" y="42" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#06b6d4" letter-spacing="1.5">SECURLYSYNC APPLICATION</text>
  <text x="30" y="60" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8">AES-256 Vault • Biometric Unlock • Real-Time Cloud Sync</text>

  <!-- Status Badge -->
  <g transform="translate(420, 26)">
    <rect width="150" height="24" rx="12" fill="#14263e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="75" y="16" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">ENCRYPTED VAULT</text>
  </g>

  <!-- Central Mobile Device Mockup Frame -->
  <g transform="translate(190, 65)" filter="url(#secShadow)">
    <rect width="220" height="320" rx="30" fill="#030811" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="8" y="8" width="204" height="304" rx="22" fill="#07101b"/>
    <rect x="80" y="14" width="60" height="12" rx="6" fill="#000000"/>

    <!-- App Header -->
    <g transform="translate(20, 36)">
      <!-- Shield Logo -->
      <path d="M 10 4 L 18 0 L 26 4 C 26 12, 18 18, 18 18 C 18 18, 10 12, 10 4 Z" fill="url(#shieldGlow)"/>
      <text x="32" y="13" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff">SecurlySync</text>
      <rect x="125" y="1" width="45" height="16" rx="8" fill="#064e3b"/>
      <text x="147" y="12" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#34d399" text-anchor="middle">SYNCED</text>
    </g>

    <!-- Master Sync Status Card -->
    <rect x="20" y="62" width="180" height="74" rx="10" fill="url(#vaultCard)" stroke="#1e3a5f"/>
    <!-- Animated Sync Ring -->
    <circle cx="50" cy="99" r="22" fill="none" stroke="#0f2942" stroke-width="4"/>
    <circle cx="50" cy="99" r="22" fill="none" stroke="url(#cyanBlue)" stroke-width="4" stroke-dasharray="100, 38" stroke-linecap="round"/>
    <text x="50" y="103" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">100%</text>

    <text x="84" y="86" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#ffffff">All Files Synced</text>
    <text x="84" y="98" font-family="'Poppins', sans-serif" font-size="7.5" fill="#94a3b8">AES-256 GCM Encrypted</text>
    <text x="84" y="112" font-family="'Poppins', sans-serif" font-size="7.5" fill="#10b981">✓ Zero Conflicts Found</text>

    <!-- Biometric Unlock Indicator -->
    <g transform="translate(20, 144)">
      <rect width="180" height="30" rx="8" fill="#0d1f33" stroke="#163252"/>
      <circle cx="16" cy="15" r="8" fill="#065f46"/>
      <text x="16" y="18" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">✓</text>
      <text x="32" y="15" font-family="'Poppins', sans-serif" font-size="8" font-weight="600" fill="#ffffff">Biometrics Active</text>
      <text x="32" y="24" font-family="'Poppins', sans-serif" font-size="7" fill="#64748b">Hardware Secure Enclave</text>
      <text x="150" y="19" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#38bdf8">LOCKED</text>
    </g>

    <!-- Encrypted Files List -->
    <g transform="translate(20, 182)">
      <!-- Item 1 -->
      <rect width="180" height="34" rx="7" fill="url(#vaultCard)" stroke="#163252"/>
      <text x="12" y="18" font-family="sans-serif" font-size="11" fill="#38bdf8">📁</text>
      <text x="30" y="17" font-family="'Poppins', sans-serif" font-size="8" font-weight="600" fill="#ffffff">Enterprise_Ledger.enc</text>
      <text x="30" y="26" font-family="'Poppins', sans-serif" font-size="6.5" fill="#64748b">4.2 MB • Updated Just Now</text>
      <text x="160" y="21" font-family="sans-serif" font-size="9" fill="#10b981">✓</text>

      <!-- Item 2 -->
      <rect y="38" width="180" height="34" rx="7" fill="url(#vaultCard)" stroke="#163252"/>
      <text x="12" y="56" font-family="sans-serif" font-size="11" fill="#818cf8">📄</text>
      <text x="30" y="55" font-family="'Poppins', sans-serif" font-size="8" font-weight="600" fill="#ffffff">Identity_Credentials.key</text>
      <text x="30" y="64" font-family="'Poppins', sans-serif" font-size="6.5" fill="#64748b">840 KB • Realtime Cloud Sync</text>
      <text x="160" y="59" font-family="sans-serif" font-size="9" fill="#10b981">✓</text>
    </g>

    <!-- Bottom Navigation -->
    <rect x="8" y="272" width="204" height="40" rx="0" fill="#040b14" stroke="#163252" stroke-width="1"/>
    <circle cx="40" cy="290" r="5" fill="#06b6d4"/>
    <circle cx="80" cy="290" r="5" fill="#334e68"/>
    <circle cx="128" cy="290" r="5" fill="#334e68"/>
    <circle cx="174" cy="290" r="5" fill="#334e68"/>
  </g>

  <!-- Side info tags -->
  <g transform="translate(30, 240)">
    <rect width="130" height="32" rx="6" fill="#0c1d30" stroke="#1e3a5f"/>
    <text x="12" y="20" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#06b6d4">🔒 AES-256 Vault</text>
  </g>
  <g transform="translate(30, 285)">
    <rect width="130" height="32" rx="6" fill="#0c1d30" stroke="#1e3a5f"/>
    <text x="12" y="20" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#06b6d4">⚡ Offline-First Sync</text>
  </g>
  <g transform="translate(435, 240)">
    <rect width="135" height="32" rx="6" fill="#0c1d30" stroke="#1e3a5f"/>
    <text x="12" y="20" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8">🛡 Biometric Enclave</text>
  </g>
  <g transform="translate(435, 285)">
    <rect width="135" height="32" rx="6" fill="#0c1d30" stroke="#1e3a5f"/>
    <text x="12" y="20" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8">🔄 Zero Conflicts</text>
  </g>
</svg>
